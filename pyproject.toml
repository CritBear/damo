[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damo-baseline"
version = "0.1.0"
description = "DAMO baseline marker configuration prediction and motion reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "torch>=2.2,<3", "PyYAML>=6,<7", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
raw = ["smplx>=0.1.28", "c3d>=0.5"]

[project.scripts]
damo = "damo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/damo/configs" = ["configs/baseline.yaml"]
